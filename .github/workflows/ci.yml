name: CI - Test & Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Test & Build
        run: mvn clean verify -B

      - name: Build Docker image (main/master branch)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: docker build -t genc-el-backend:${{ github.sha }} .

  redis-integration-test:
    runs-on: ubuntu-latest
    needs: test-and-build
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run Redis integration test
        run: mvn -Dtest=TaskAssignmentRedisServiceIntegrationTest test -B

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for compose
        run: |
          cat > .env << 'EOF'
          SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/gencel
          SPRING_DATASOURCE_USERNAME=postgres
          SPRING_DATASOURCE_PASSWORD=postgres
          POSTGRES_DB=gencel
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          REDIS_HOST=redis
          REDIS_PORT=6379
          JWT_SECRET=ci-secret-key-for-smoke-tests-only
          JWT_EXPIRATION=86400000
          EOF

      - name: Run docker compose smoke test
        run: ./scripts/docker-smoke-test.sh
