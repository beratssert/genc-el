spring.application.name=genc-el-backend

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Server Port
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Firebase / FCM Configuration (disabled by default)
firebase.server-key=${FIREBASE_SERVER_KEY:}

# File Storage Configuration
app.storage.type=local
app.storage.local.path=${APP_STORAGE_LOCAL_PATH:/uploads}
app.storage.max-file-size=${APP_STORAGE_MAX_FILE_SIZE:5242880}

# Multipart file upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
